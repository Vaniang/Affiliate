<style>

  .scene .shot input{border:0;background:transparent;font:800 12px system-ui;padding:0;width:120px;text-transform:uppercase;color:#191919}

  .scene textarea{background:transparent;border:0;color:#2a251e;font:400 13px/1.45 system-ui;min-height:42px;padding:0;resize:vertical}
  .scene .ost{font:italic 400 13px Georgia,serif;color:#3c372f}
  .scene .ost input{border:0;background:transparent;font:italic 600 13px Georgia,serif;width:75%;padding:0;color:#191919}

<body>
<header>
  <h1>🎬 Affiliate Video Studio</h1>
  <select id="projects"></select>
  <button id="save" class="primary">💾 Save</button>
  <div id="status"></div>
</header>

<nav id="tabs">
  <button data-step="0" class="on">1 · Pictures</button>
  <button data-step="1">2 · Storyboard</button>
  <button data-step="2">3 · Script & Voice</button>
  <button data-step="3">4 · Export</button>

<main>
  <section id="step-0">
    <div class="row">
      <label>Product name <input id="product" placeholder="e.g. Michaela Comfort Heels"></label>
      <label>Tagline <input id="tagline" placeholder="e.g. Step into confidence. Every day."></label>

  <section id="step-1" hidden>
    <div id="sheet">
      <div class="head">
        <div><h2>STORYBOARD</h2><div id="sbProduct"></div><div id="sbTag"></div></div>

      <span id="sceneCount"></span>
      <div class="row">

        <button id="autoDur">⏱ Auto-fit durations</button>
      </div>

  <section id="step-2" hidden>
    <div class="bar-row">
      <button id="buildScript">🧱 Script from storyboard</button>
      <button id="aiScriptBtn">✨ AI voice-over script (Gemini)</button>
      <button id="previewVoice">🔊 Preview voice</button>
    </div>
    <textarea id="script" rows="8" placeholder="Voice-over script…"></textarea>
    <div class="row">

      <input id="geminiKey" type="password" placeholder="Gemini API key (AI storyboard/script)">
      <input id="openaiKey" type="password" placeholder="OpenAI API key (exportable voice-over)">
    </details>
  </section>

  <section id="step-3" hidden>
    <div class="row">
      <label>Format <select id="aspect"><option value="9:16">9:16 Shorts/Reels</option>
        <option value="16:9">16:9 YouTube</option></select></label>
      <label>Voice-over <select id="audioSource">
        <option value="none">None</option><option value="tts">OpenAI TTS</option>
        <option value="file">Audio file</option><option value="mic">Record mic live</option></select></label>
      <select id="ttsVoice"><option>alloy</option><option>nova</option><option>echo</option>
        <option>fable</option><option>onyx</option><option>shimmer</option></select>

    <video id="preview" controls></video>

<script type="module">
/* ═══════════════════════ CONFIG ═══════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyAVpw7oxey1HiJpf8aolt2UrnyP51Nl9lk",
  authDomain: "affiliate-95357.firebaseapp.com",
  projectId: "affiliate-95357",
  storageBucket: "affiliate-95357.firebasestorage.app",
  messagingSenderId: "469465402857",
  appId: "1:469465402857:web:39aa150718cb2c428c4f78",
  measurementId: "G-N6DMP5HPN8"
};
const CLOUDINARY = { cloudName: "ddfuet1q", uploadPreset: "affiliate_materials" };
const GEMINI_MODEL = "gemini-2.0-flash";

const HAS_FIREBASE   = !/YOUR_/.test(firebaseConfig.apiKey || "YOUR_");
const HAS_CLOUDINARY = !/YOUR_/.test(CLOUDINARY.cloudName || "YOUR_");

/* ═══════════════════════ FIREBASE ═══════════════════════ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let auth = null, db = null;
if (HAS_FIREBASE) { const app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); }
const ensureAuth = () => HAS_FIREBASE
  ? new Promise(res => onAuthStateChanged(auth, u => u ? res(u) : signInAnonymously(auth).then(r => res(r.user))))
  : Promise.resolve({ uid: "local" });

/* ═══════════════════════ CLOUDINARY ═══════════════════════ */
function uploadToCloudinary(file, onProgress) {
  return new Promise((resolve, reject) => {
    const type = file.type.startsWith("video") ? "video" : "image";
    const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/${type}/upload`;
    const form = new FormData();
    form.append("file", file); form.append("upload_preset", CLOUDINARY.uploadPreset);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.upload.onprogress = e => onProgress && onProgress(e.loaded / e.total);
    xhr.onload = () => xhr.status < 300 ? resolve(JSON.parse(xhr.responseText)) : reject(new Error(xhr.statusText));
    xhr.onerror = () => reject(new Error("Upload failed"));
    xhr.send(form);
  });
}
const optimize = url => url.replace("/upload/", "/upload/f_auto,q_auto/");
async function uploadMedia(file, onProgress) {
  if (!HAS_CLOUDINARY) { onProgress && onProgress(1); return { secure_url: URL.createObjectURL(file) }; }
  const r = await uploadToCloudinary(file, onProgress);
  r.secure_url = optimize(r.secure_url);
  return r;
}

/* ═══════════════════════ STORYBOARD ENGINE ═══════════════════════ */
const SHOT_ARC = ["Opening Shot","Close-Up","Lifestyle Shot","Work Scene","Everyday Scene","Detail Shot","Hero Shot","End Card"];
const SHOT_DESC = {
  "Opening Shot":"Elegant product flat lay.",
  "Close-Up":"Close-up on premium material and fine stitching.",
  "Lifestyle Shot":"Model walking confidently. Smooth steps, everyday elegance.",
  "Work Scene":"Perfect for the office. Comfort that keeps up with you.",
  "Everyday Scene":"From errands to dinner plans. Versatile. Reliable. Beautiful.",
  "Detail Shot":"Sturdy block heel for stability and all-day support.",
  "Hero Shot":"The perfect blend of style and comfort. Made for women who do it all.",
  "End Card":"Brand logo and tagline. Call to action."
};
const SHOT_OST = {
  "Opening Shot":"Elegance in Every Step.",
  "Close-Up":"Premium. Refined. Timeless.",
  "Lifestyle Shot":"Made for Every Moment.",
  "Work Scene":"All-Day Comfort.",
  "Everyday Scene":"Your Go-To Heels.",
  "Detail Shot":"Steady. Strong. Stylish.",
  "Hero Shot":"",          // filled with product name
  "End Card":"Shop Now."
};
const SHOT_DUR = { "Opening Shot":3,"Close-Up":4,"Lifestyle Shot":6,"Work Scene":6,"Everyday Scene":6,"Detail Shot":5,"Hero Shot":7,"End Card":8 };

function templateStoryboard() {
  const n = project.scenes.length, middle = SHOT_ARC.slice(1, -1);
  project.scenes.forEach((s, i) => {
    const type = i === 0 ? "Opening Shot" : i === n - 1 ? "End Card" : middle[(i - 1) % middle.length];
    s.shotType = type;
    s.description = SHOT_DESC[type];
    s.onScreenText = type === "Hero Shot" ? ($("#product").value || "The Perfect Pair.") : SHOT_OST[type];
    s.duration = SHOT_DUR[type];
  });
}

const blobToB64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.readAsDataURL(blob); });

// shrink photos before sending to Gemini → smaller payload → fewer 429s on free tier
async function shrinkForAI(url, max = 768) {
  const img = await loadImage(url);
  const r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return { mime: "image/jpeg", b64: c.toDataURL("image/jpeg", 0.8).split(",")[1] };
}

const PREF_MODELS = ["gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-2.0-flash", "gemini-2.0-flash-lite", "gemini-1.5-flash"];
let cachedModel = null;
async function pickModel(key) {                      // ask Google which models this key can use
  if (cachedModel) return cachedModel;
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}&pageSize=100`);
    if (r.ok) {
      const names = ((await r.json()).models || []).map(m => m.name.replace("models/", ""));
      const hit = PREF_MODELS.find(p => names.includes(p)) || names.find(n => n.includes("flash") && !n.includes("preview"));
      if (hit) return (cachedModel = hit);
    }
  } catch {}
  return (cachedModel = PREF_MODELS[0]);
}

async function gemini(apiKey, parts, json = false) {
  const body = JSON.stringify({ contents: [{ parts }],
    ...(json ? { generationConfig: { responseMimeType: "application/json" } } : {}) });
  let lastErr = "";
  for (const m of [...new Set([await pickModel(apiKey), ...PREF_MODELS])]) {
    for (let attempt = 0; attempt < 2; attempt++) {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`,
        { method: "POST", headers: { "Content-Type": "application/json" }, body });
      if (res.ok) { cachedModel = m; const d = await res.json(); return d.candidates[0].content.parts[0].text.trim(); }
      const j = await res.json().catch(() => null);
      lastErr = `Gemini ${res.status} on ${m} — ${j?.error?.message || res.statusText}`;
      if (res.status === 429) { await new Promise(r => setTimeout(r, 10000)); continue; }  // quota → wait 10s, retry
      break;                                                                                // 404/403 → try next model
    }
  }
  throw new Error(lastErr || "Gemini failed");
}

// 📸 photos → professional storyboard (vision, all images at once)
async function aiStoryboard(key) {
  const n = project.scenes.length;
  const parts = [{ text:
    `You are an award-winning commercial storyboard artist. Product: "${$("#product").value}". Tagline: "${$("#tagline").value}".
    I give you ${n} product photos IN ORDER. Build a 30-45 second promo storyboard using EVERY photo in the given order.
    Arc: first "Opening Shot", last "End Card", middle a mix of "Close-Up","Lifestyle Shot","Work Scene","Everyday Scene","Detail Shot","Hero Shot".
    Return STRICT JSON: an array with exactly ${n} objects, one per photo, in order:
    [{"shotType":"...","description":"one or two short narration sentences","onScreenText":"2-6 word tagline","duration":seconds}]
    Durations must add up to between 30 and 45.` }];
  for (const s of project.scenes) {
    const im = await shrinkForAI(s.url);
    parts.push({ inline_data: { mime_type: im.mime, data: im.b64 } });
  }
  const txt = await gemini(key, parts, true);
  const arr = JSON.parse(txt.match(/\[[\s\S]*\]/)[0]);
  arr.forEach((a, i) => { if (project.scenes[i]) Object.assign(project.scenes[i], {
    shotType: a.shotType || project.scenes[i].shotType,
    description: a.description || "", onScreenText: a.onScreenText || "",
    duration: +a.duration || project.scenes[i].duration }); });
}

// one photo → better caption (per-scene ✨ button)
async function aiSceneCaption(key, scene) {
  const im = await shrinkForAI(scene.url);
  const txt = await gemini(key, [
    { text: `Product: "${$("#product").value}". For this photo (shot type "${scene.shotType}"), return STRICT JSON:
      {"description":"one or two short narration sentences","onScreenText":"2-6 word tagline"}` },
    { inline_data: { mime_type: im.mime, data: im.b64 } }], true);
  const a = JSON.parse(txt.match(/\{[\s\S]*\}/)[0]);
  scene.description = a.description || scene.description;
  scene.onScreenText = a.onScreenText || scene.onScreenText;
}

/* ═══════════════════════ SCRIPT / VOICE ═══════════════════════ */
function buildScript(scenes, product, tagline) {
  const p = product || "this product";
  const lines = [`Introducing ${p}${tagline ? " — " + tagline : ""}.`];
  scenes.forEach(s => { if (!/end\s?card/i.test(s.shotType)) lines.push(s.description); });
  lines.push(`Shop now — link in bio. Using my affiliate link supports the channel at no extra cost to you.`);
  return lines.join("\n");
}
async function aiScript(key, scenes, product) {
  const board = scenes.map((s, i) => `${i + 1}. [${s.shotType}] ${s.description} | on screen: "${s.onScreenText}"`).join("\n");
  return gemini(key, [{ text:
    `You write viral 30-45s commercial voice-overs. Product: ${product || "unknown"}.\nStoryboard:\n${board}\n\n` +
    `Write a natural voice-over script matching the scenes in order. End with a CTA + clear affiliate disclosure. Plain text only.` }]);
}
function speak(text, { voiceURI, rate = 1 } = {}) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = speechSynthesis.getVoices().find(v => v.voiceURI === voiceURI);
  if (v) u.voice = v;
  u.rate = rate; speechSynthesis.speak(u);
}
const stopSpeaking = () => speechSynthesis.cancel();
async function openaiTTS(text, apiKey, voice = "alloy") {
  const res = await fetch("https://api.openai.com/v1/audio/speech", {
    method: "POST", headers: { Authorization: `Bearer ${apiKey}`, "Content-Type": "application/json" },
    body: JSON.stringify({ model: "tts-1", voice, input: text }) });
  if (!res.ok) throw new Error("TTS " + res.status);
  return res.blob();
}

/* ═══════════════════════ VIDEO RENDERER ═══════════════════════ */
const loadImage = src => new Promise((res, rej) => {
  const i = new Image();
  if (/^https?:/.test(src)) i.crossOrigin = "anonymous";
  i.onload = () => res(i); i.onerror = rej; i.src = src;
});
const pickMime = () => ["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"]
  .find(m => MediaRecorder.isTypeSupported(m)) || "";
function drawCover(ctx, img, W, H, zoom = 1) {
  const r = Math.max(W / img.width, H / img.height) * zoom;
  const w = img.width * r, h = img.height * r;
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
}
function wrap(ctx, text, x, y, maxW, lh) {
  let line = "";
  for (const w of String(text).split(/\s+/)) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = w; }
    else line = t;
  }
  if (line) ctx.fillText(line, x, y);
}
async function renderVideo(project, { aspect = "9:16", audioBlob = null, useMic = false, onProgress } = {}) {
  const [W, H] = aspect === "9:16" ? [1080, 1920] : [1920, 1080];
  const canvas = Object.assign(document.createElement("canvas"), { width: W, height: H });
  const ctx = canvas.getContext("2d");
  const imgs = await Promise.all(project.scenes.map(s => loadImage(s.url)));
  const total = project.scenes.reduce((a, s) => a + (+s.duration || 3), 0);

  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC(); await ac.resume();
  const dest = ac.createMediaStreamDestination();
  let src = null, mic = null;
  if (audioBlob) {
    src = ac.createBufferSource();
    src.buffer = await ac.decodeAudioData(await audioBlob.arrayBuffer());
    src.connect(dest); if (!useMic) src.connect(ac.destination);
  }
  if (useMic) { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); ac.createMediaStreamSource(mic).connect(dest); }

  const stream = canvas.captureStream(30);
  dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const mime = pickMime();
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);

  function draw(t) {
    let acc = 0, idx = project.scenes.length - 1, local = 0;
    for (let i = 0; i < project.scenes.length; i++) {
      const d = +project.scenes[i].duration || 3;
      if (t < acc + d) { idx = i; local = t - acc; break; }
      acc += d;
    }
    const s = project.scenes[idx];

    if (/end\s?card/i.test(s.shotType || "")) {                       // ── brand end card
      ctx.fillStyle = "#f3ede4"; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center"; ctx.fillStyle = "#191919";
      ctx.font = `500 ${W * .085}px Georgia, serif`;
      wrap(ctx, (project.product || "YOUR PRODUCT").toUpperCase(), W / 2, H * .42, W * .82, W * .105);
      ctx.font = `italic 400 ${W * .042}px Georgia, serif`; ctx.fillStyle = "#5a5248";
      ctx.fillText(project.tagline || s.onScreenText, W / 2, H * .52);
      const bw = W * .5, bh = W * .085;
      ctx.strokeStyle = "#191919"; ctx.lineWidth = 3;
      ctx.strokeRect((W - bw) / 2, H * .62, bw, bh);
      ctx.fillStyle = "#191919"; ctx.font = `700 ${W * .035}px system-ui`; ctx.textBaseline = "middle";
      ctx.fillText("S H O P   N O W", W / 2, H * .62 + bh / 2); ctx.textBaseline = "alphabetic";
      ctx.font = `600 ${W * .026}px system-ui`; ctx.fillStyle = "#6b6357";
      ctx.fillText("link in bio  •  #ad", W / 2, H * .62 + bh + W * .06);
    } else {                                                          // ── normal scene
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      drawCover(ctx, imgs[idx], W, H, 1.05 + 0.07 * (local / s.duration));
      const g = ctx.createLinearGradient(0, H * .5, 0, H);
      g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.88)");
      ctx.fillStyle = g; ctx.fillRect(0, H * .5, W, H * .5);
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.font = `700 ${W * .032}px system-ui`;
      ctx.fillText(`${String(idx + 1).padStart(2, "0")} · ${(s.shotType || "").toUpperCase()}`, W / 2, H * .055);
      ctx.fillStyle = "#fff";
      ctx.font = `italic 700 ${W * .066}px Georgia, serif`;
      wrap(ctx, s.onScreenText || s.description, W / 2, H * .84, W * .86, W * .085);
    }
    ctx.fillStyle = "rgba(255,255,255,.25)"; ctx.fillRect(0, 0, W, 10);
    ctx.fillStyle = "#ffd166"; ctx.fillRect(0, 0, W * (t / total), 10);
  }

  rec.start(250); src && src.start();
  const t0 = performance.now();
  await new Promise(resolve => {
    (function frame(now) {
      const t = (now - t0) / 1000;
      if (t >= total) { draw(total - .01); return resolve(); }
      draw(t); onProgress && onProgress(t / total);
      requestAnimationFrame(frame);
    })(t0);
  });
  rec.stop(); await stopped;
  stream.getTracks().forEach(t => t.stop());
  mic && mic.getTracks().forEach(t => t.stop());
  ac.close();
  return new Blob(chunks, { type: mime || "video/webm" });
}

/* ═══════════════════════ APP / UI ═══════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const newProject = () => ({ id: crypto.randomUUID(), title: "Video " + new Date().toLocaleDateString(),
  product: "", tagline: "", scenes: [], script: "", videoUrl: "" });
let user, cache = [], project = newProject(), lastBlob = null, lastURL = null;

init();
async function init() {
  $("#status").textContent =
    (HAS_FIREBASE ? "🔥 Firebase ✓" : "🔥 local-only") + "  ·  " + (HAS_CLOUDINARY ? "☁️ Cloudinary ✓" : "☁️ local media");
  user = await ensureAuth();
  ["geminiKey", "openaiKey"].forEach(k => {
    $("#" + k).value = localStorage.getItem(k) || "";
    $("#" + k).oninput = e => localStorage.setItem(k, e.target.value);
  });
  bind(); loadProjects();
  const fill = () => { $("#voice").innerHTML = speechSynthesis.getVoices()
    .map(v => `<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join(""); };
  speechSynthesis.onvoiceschanged = fill; fill();
}

function gotoStep(n) {
  document.querySelectorAll("#tabs button").forEach((x, i) => x.classList.toggle("on", i === n));
  for (let i = 0; i < 4; i++) $("#step-" + i).hidden = i !== n;
  if (n === 2 && !$("#script").value.trim()) { $("#script").value = buildScript(project.scenes, project.product, project.tagline); project.script = $("#script").value; }
}

function bind() {
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (b) gotoStep(+b.dataset.step); };
  $("#product").oninput = e => { project.product = e.target.value; $("#sbProduct").textContent = (e.target.value || "YOUR PRODUCT").toUpperCase(); };
  $("#tagline").oninput = e => { project.tagline = e.target.value; $("#sbTag").textContent = e.target.value; };

  $("#fileInput").onchange = async e => {
    for (const f of [...e.target.files]) {
      const card = document.createElement("div");
      card.className = "card"; card.innerHTML = `${f.name}<div class="bar"></div>`;
      $("#uploads").appendChild(card);
      try {
        const r = await uploadMedia(f, p => card.querySelector(".bar").style.width = p * 100 + "%");
        project.scenes.push({ url: r.secure_url, shotType: "", description: "", onScreenText: "", duration: 4 });
      } catch (err) { alert("Upload failed: " + err.message); }
      card.remove();
    }
    await makeStoryboard();
    gotoStep(1);
  };

  $("#autoBoard").onclick = () => makeStoryboard(true);
  $("#autoDur").onclick = () => { project.scenes.forEach(s => s.duration = +Math.min(8, Math.max(2.5, s.description.split(/\s+/).length * .45 + 1)).toFixed(1)); renderBoard(); };

  $("#scenes").oninput = e => { const k = e.target.dataset.k; if (!k) return;
    const s = project.scenes[e.target.closest(".scene").dataset.i];
    s[k] = k === "duration" ? parseFloat(e.target.value) || 3 : e.target.value;
    if (k !== "duration") renderBoardHead(); };

  $("#scenes").onclick = async e => {
    const b = e.target.closest("button"); if (!b) return;
    const i = +e.target.closest(".scene").dataset.i, a = b.dataset.a, S = project.scenes;
    if (a === "del") S.splice(i, 1);
    if (a === "up" && i > 0) [S[i - 1], S[i]] = [S[i], S[i - 1]];
    if (a === "down" && i < S.length - 1) [S[i + 1], S[i]] = [S[i], S[i + 1]];
    if (a === "ai") { const key = $("#geminiKey").value.trim();
      if (!key) return alert("Add your free Gemini key in step 3 first.");
      b.disabled = true;
      try { await aiSceneCaption(key, S[i]); } catch (err) { alert(err.message); }
      b.disabled = false; }
    renderBoard();
  };

  $("#buildScript").onclick = () => { $("#script").value = buildScript(project.scenes, project.product, project.tagline); project.script = $("#script").value; };
  $("#aiScriptBtn").onclick = async () => { const key = $("#geminiKey").value.trim();
    if (!key) return alert("Gemini key needed.");
    try { $("#script").value = await aiScript(key, project.scenes, $("#product").value); project.script = $("#script").value; }
    catch (err) { alert(err.message); } };
  $("#script").oninput = e => project.script = e.target.value;
  $("#previewVoice").onclick = () => speak(project.script, { voiceURI: $("#voice").value, rate: +$("#rate").value });

  $("#render").onclick = async () => {
    if (!project.scenes.length) return alert("Add some pictures first.");
    stopSpeaking();
    const srcSel = $("#audioSource").value, key = $("#openaiKey").value.trim();
    let audioBlob = null, useMic = false;
    try {
      if (srcSel === "tts") { if (!key) return alert("OpenAI key needed for TTS export (or use mic/file).");
        audioBlob = await openaiTTS(project.script, key, $("#ttsVoice").value); }
      if (srcSel === "file") { const f = $("#voiceFile").files[0]; if (!f) return alert("Pick an audio file."); audioBlob = f; }
      if (srcSel === "mic") useMic = true;
      $("#render").disabled = true;
      lastBlob = await renderVideo(project, { aspect: $("#aspect").value, audioBlob, useMic,
        onProgress: p => $("#progress").style.width = p * 100 + "%" });
      if (lastURL) URL.revokeObjectURL(lastURL);
      $("#preview").src = lastURL = URL.createObjectURL(lastBlob);
      $("#uploadVideo").disabled = false;
    } catch (err) { alert("Render failed: " + err.message); }
    $("#render").disabled = false;
  };

  $("#uploadVideo").onclick = async () => {
    if (!HAS_CLOUDINARY) return alert("Add your Cloudinary config to host the final video.");
    const r = await uploadToCloudinary(new File([lastBlob], project.title + ".webm", { type: lastBlob.type }));
    project.videoUrl = r.secure_url; save(); alert("☁️ Video hosted on Cloudinary!");
  };

  $("#save").onclick = save;
  $("#projects").onchange = e => {
    project = e.target.value === "new" ? newProject() : structuredClone(cache.find(p => p.id === e.target.value));
    syncUI();
  };
}

async function makeStoryboard(force) {
  const key = $("#geminiKey").value.trim();
  if (key) { try { await aiStoryboard(key); } catch (err) { alert("AI storyboard failed, using template: " + err.message); templateStoryboard(); } }
  else templateStoryboard();
  renderBoard();
}

function renderBoardHead() {
  $("#sbProduct").textContent = (project.product || "YOUR PRODUCT").toUpperCase();
  $("#sbTag").textContent = project.tagline || "";
  const total = project.scenes.reduce((a, s) => a + (+s.duration || 3), 0);
  $("#sbMeta").innerHTML = `DURATION: ${Math.round(total)} SECONDS<br>FORMAT: COMMERCIAL / PROMO`;
  $("#sceneCount").textContent = project.scenes.length + " scenes";
}

function renderBoard() {
  renderBoardHead();
  const grid = $("#scenes"); grid.innerHTML = "";
  let acc = 0;
  project.scenes.forEach((s, i) => {
    const start = fmt(acc), end = fmt(acc + (+s.duration || 3)); acc += +s.duration || 3;
    const el = document.createElement("div");
    el.className = "scene"; el.dataset.i = i;
    el.innerHTML = `<img src="${s.url}" alt="">
      <div class="shot"><span>${String(i + 1).padStart(2, "0")}.</span>
        <input data-k="shotType" value="${esc(s.shotType)}"><span class="tc">(${start}–${end})</span></div>
      <textarea data-k="description">${esc(s.description)}</textarea>
      <div class="ost">Text on screen: "<input data-k="onScreenText" value="${esc(s.onScreenText)}">"</div>
      <div class="ctrl"><input type="number" min="1" max="15" step="0.5" data-k="duration" value="${s.duration}">s
        <button data-a="ai" title="AI rewrite">✨</button><button data-a="up">↑</button>
        <button data-a="down">↓</button><button data-a="del">✕</button></div>`;
    grid.appendChild(el);
  });
}

function syncUI() {
  $("#product").value = project.product || ""; $("#tagline").value = project.tagline || "";
  $("#script").value = project.script || ""; renderBoard();
}
function renderProjectsSelect() {
  $("#projects").innerHTML = cache.map(p => `<option value="${p.id}">${p.title}</option>`).join("")
    + `<option value="new">＋ New project</option>`;
}
async function save() {
  project.product = $("#product").value; project.tagline = $("#tagline").value; project.script = $("#script").value;
  if (!HAS_FIREBASE) {
    project.updatedAt = Date.now();
    cache = [project, ...cache.filter(p => p.id !== project.id)];
    localStorage.setItem("avs_projects", JSON.stringify(cache));
    renderProjectsSelect(); return;
  }
  await setDoc(doc(db, "projects", project.id), { ...project, uid: user.uid, updatedAt: serverTimestamp() });
  loadProjects();
}
async function loadProjects() {
  if (!HAS_FIREBASE) {
    try { cache = JSON.parse(localStorage.getItem("avs_projects") || "[]"); } catch { cache = []; }
    cache.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    renderProjectsSelect(); return;
  }
  const snap = await getDocs(query(collection(db, "projects"), where("uid", "==", user.uid)));
  cache = snap.docs.map(d => d.data()).sort((a, b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));
  renderProjectsSelect();
}
</script>
